name: "CodeQL Analysis (Deshabilitado)"

# Workflow deshabilitado: No se usa CodeQL actualmente
# El proyecto es PHP puro sin JavaScript
# Se mantiene el archivo como referencia para futuras necesidades

on:
  workflow_dispatch:  # Solo manual, nunca automático

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze PHP Code
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: [ 'php' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Initializes the CodeQL tools for scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:php"
