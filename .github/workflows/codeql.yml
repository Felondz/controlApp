name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "config/**"
      - "routes/**"
      - "database/**"
      - "bootstrap/**"
      - "*.php"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "config/**"
      - "routes/**"
      - "database/**"
      - "bootstrap/**"
      - "*.php"
      - "composer.json"
      - "composer.lock"
  schedule:
    # Run CodeQL analysis weekly on Monday at 3:00 AM UTC
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze PHP Code
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: [ 'php' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initializes the CodeQL tools for scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          # For more details on CodeQL's query suites, refer to:
          # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/about-code-scanning-with-codeql
          queries: security-and-quality

      # Autobuild attempts to build any compiled languages (C/C++, C#, or Java)
      # If this step fails, then you should remove it and run the build manually
      # (see below)
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

      # If the Autobuild fails above, remove it and uncomment the following
      # three lines, adjusting the paths as needed
      # - name: Build PHP code
      #   run: |
      #     php -r "echo 'PHP version: ' . PHP_VERSION . PHP_EOL;"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:php"
