name: CI/CD Pipeline (Multi-Environment)

on:
  push:
    branches: [ "main", "develop" ] # Agregamos la rama de testing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: felondz/controlapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generamos metadatos dinámicos según la rama
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Si es main, usa 'latest'. Si es develop, usa 'testing'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab]
    steps:
      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DEPLOY_PATH=/home/guaro/docker-sites/controlapp" >> $GITHUB_ENV
            echo "APP_DOMAIN=controlapp.site" >> $GITHUB_ENV
            echo "APP_ENV=production" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DB_DATABASE=control_prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "DEPLOY_PATH=/home/guaro/docker-sites/controlapp-ptr" >> $GITHUB_ENV
            echo "APP_DOMAIN=ptr.controlapp.site" >> $GITHUB_ENV
            echo "APP_ENV=local" >> $GITHUB_ENV
            echo "IMAGE_TAG=testing" >> $GITHUB_ENV
            echo "DB_DATABASE=control_ptr" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry (Local)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/felondz/controlapp:$IMAGE_TAG

      - name: Prepare Directory
        run: mkdir -p $DEPLOY_PATH

      # --- CORRECCIÓN 1: Descargar el archivo DE LA RAMA CORRECTA ---
      - name: Download Docker Compose
        run: |
          # Agregamos '?ref=${{ github.ref }}' para bajar el archivo de la rama actual (develop o main)
          # Si no pones esto, siempre baja el de main (que quizás es el viejo)
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o $DEPLOY_PATH/docker-compose.yml \
            -L "https://api.github.com/repos/Felondz/controlApp/contents/docker-compose.prod.yml?ref=${{ github.ref_name }}"

      # --- CORRECCIÓN 2: Agregar TODAS las variables al .env ---
      - name: Create .env file
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          APP_KEY: ${{ secrets.APP_KEY }}
          MEILISEARCH_KEY: ${{ secrets.MEILISEARCH_KEY }}
        run: |
          cd $DEPLOY_PATH
          echo "APP_ENV=$APP_ENV" > .env
          echo "APP_DOMAIN=$APP_DOMAIN" >> .env
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          echo "DB_DATABASE=$DB_DATABASE" >> .env
          
          # Variables Secretas (Mapeadas desde env)
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env
          echo "DB_USERNAME=$DB_USERNAME" >> .env
          echo "APP_KEY=$APP_KEY" >> .env
          echo "MEILISEARCH_KEY=$MEILISEARCH_KEY" >> .env

      - name: Deploy and Optimize
        run: |
          cd $DEPLOY_PATH
          
          # Bajamos los contenedores viejos PRIMERO para refrescar la configuración de nombres
          # Esto ayuda si cambiaste nombres en el docker-compose
          docker compose down --remove-orphans || true
          
          echo "🚀 Desplegando en entorno: ${{ env.APP_ENV }}"
          docker compose up -d --force-recreate
          
          echo "⏳ Esperando estabilización (15s)..."
          sleep 15
          
          # Comandos de Laravel
          # Usamos el nombre del servicio 'app' que docker-compose resuelve internamente
          docker compose exec -T app php artisan migrate --force
          
          if [[ "${{ env.APP_ENV }}" != "production" ]]; then
             echo "🌱 Seeders de prueba..."
             docker compose exec -T app php artisan db:seed --force
          fi
          
          docker compose exec -T app php artisan optimize:clear
          docker compose exec -T app php artisan optimize
          docker compose exec -T app php artisan view:cache
          docker compose exec -T app php artisan storage:link
          docker compose exec -T app php artisan queue:restart
          
      - name: Cleanup
        run: docker image prune -f