name: Deploy to Homelab

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: felondz/controlapp

jobs:
  # TRABAJO 1: Construir y Subir Imagen a GitHub
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # TRABAJO 2: Desplegar en TU Servidor (Runner)
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab] # <--- Busca tu servidor por la etiqueta 'homelab'
    steps:
      - name: Login to GitHub Container Registry (Local)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/felondz/controlapp:latest

      - name: Update Docker Compose File
        run: |
          mkdir -p /home/guaro/docker-sites/controlapp
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o /home/guaro/docker-sites/controlapp/docker-compose.yml \
            -L https://api.github.com/repos/Felondz/controlApp/contents/docker-compose.prod.yml

      - name: Deploy Containers
        working-directory: /home/guaro/docker-sites/controlapp
        run: |
          docker compose down
          docker compose up -d
          
          echo "⏳ Esperando a que la Base de Datos inicie..."
          sleep 30
          
          docker compose exec -T app php artisan migrate --force
          docker image prune -f