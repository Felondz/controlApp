name: Deploy to Homelab

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: felondz/controlapp

jobs:
  # TRABAJO 1: Construir y Subir Imagen a GitHub
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # TRABAJO 2: Desplegar en TU Servidor (Runner Self-Hosted)
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab]
    steps:
      - name: Login to GitHub Container Registry (Local)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/felondz/controlapp:latest

      - name: Update Docker Compose File
        # Descarga siempre la última versión de tu docker-compose de producción
        run: |
          mkdir -p /home/guaro/docker-sites/controlapp
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o /home/guaro/docker-sites/controlapp/docker-compose.yml \
            -L https://api.github.com/repos/Felondz/controlApp/contents/docker-compose.prod.yml

      - name: Deploy and Optimize
        run: |
          cd /home/guaro/docker-sites/controlapp
          
          # 1. Detener contenedores viejos para evitar conflictos de puerto/memoria
          # (Opcional, pero recomendado si hay cambios grandes)
          # docker compose down 
          
          # 2. Levantar contenedores con la nueva imagen
          echo "🚀 Levantando contenedores..."
          docker compose up -d --force-recreate --remove-orphans
          
          # 3. Espera de seguridad (Dar tiempo a MySQL y Redis para iniciar)
          echo "⏳ Esperando estabilización de servicios (10s)..."
          sleep 10
          
          # 4. Ejecutar migraciones de base de datos
          echo "🗄️ Ejecutando migraciones..."
          docker compose exec -T app php artisan migrate --force

          # 5. Ejecutar Seeders (Crear/Actualizar SuperAdmin)
          echo "🌱 Verificando SuperAdmin y Seeders..."
          docker compose exec -T app php artisan db:seed --force
          
          # 6. --- OPTIMIZACIÓN CRÍTICA (ESTO EVITA EL ERROR 504) ---
          echo "🧹 Limpiando y cacheando configuración..."
          
          # Borrar cualquier caché vieja que pueda causar conflictos
          docker compose exec -T app php artisan optimize:clear
          
          # Regenerar caché de configuración, rutas y eventos para producción
          docker compose exec -T app php artisan optimize
          
          # Cachear las vistas (importante para rendimiento en monolitos Blade/Inertia)
          docker compose exec -T app php artisan view:cache
          
          # Asegurar que los enlaces simbólicos de storage existan
          docker compose exec -T app php artisan storage:link
          
          # Reiniciar cola de trabajos (si usas workers, para que tomen el nuevo código)
          # Reiniciar cola de trabajos (si usas workers, para que tomen el nuevo código)
          docker compose exec -T app php artisan queue:restart

          # 7. Indexar datos en Meilisearch (Automatización de Búsqueda)
          echo "🔍 Indexando datos en Meilisearch..."
          docker compose exec -T app php artisan scout:import "App\Models\User"
          docker compose exec -T app php artisan scout:import "App\Models\Proyecto"
          # ---------------------------------------------------------
          
          # 7. Limpieza de imágenes viejas de Docker (ahorra espacio en disco)
          echo "🗑️ Limpiando imágenes antiguas..."
          docker image prune -f