name: Deploy to Homelab

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: felondz/controlapp

jobs:
  # TRABAJO 1: Construir y Subir Imagen a GitHub
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # TRABAJO 2: Desplegar en TU Servidor (Runner)
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab] # <--- Busca tu servidor por la etiqueta 'homelab'
    steps:
      - name: Login to GitHub Container Registry (Local)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/felondz/controlapp:latest

      - name: Update Docker Compose File
        run: |
          mkdir -p /home/guaro/docker-sites/controlapp
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o /home/guaro/docker-sites/controlapp/docker-compose.yml \
            -L https://api.github.com/repos/Felondz/controlApp/contents/docker-compose.prod.yml

      - name: Deploy Containers
        run: |
          cd /home/guaro/docker-sites/controlapp
          
          # 1. Descargar imágenes primero (para minimizar tiempo de espera)
          docker compose pull
          
          # 2. Actualizar SIN tirar todo abajo (Smart Update)
          # Esto solo reinicia la App, la DB se queda prendida si no cambió
          docker compose up -d --remove-orphans
          
          # 3. Espera de seguridad (Por si acaso es la primera vez que se prende la DB)
          echo "⏳ Dando tiempo de estabilización..."
          sleep 15
          
          # 4. Ejecutar migraciones
          # Usamos un bucle: Intenta migrar, si falla, espera 5s y reintenta (hasta 5 veces)
          echo "🚀 Ejecutando migraciones..."
          for i in {1..5}; do
            docker compose exec -T app php artisan migrate --force && break || {
              echo "⚠️ La base de datos aún no está lista, reintentando en 10s... ($i/5)"
              sleep 10
            }
          done
          
          # 5. Limpieza
          docker image prune -f