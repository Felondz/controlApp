name: CI/CD Pipeline (Multi-Environment)

on:
  push:
    branches: [ "main", "develop" ] # Agregamos la rama de testing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: felondz/controlapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Build Arguments
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "VITE_REVERB_HOST=ws.controlapp.site" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "VITE_REVERB_HOST=ws.ptr.controlapp.site" >> $GITHUB_ENV
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generamos metadatos dinámicos según la rama
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Si es main, usa 'latest'. Si es develop, usa 'testing'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ env.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab]
    steps:
      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DEPLOY_PATH=/home/guaro/docker-sites/controlapp" >> $GITHUB_ENV
            echo "APP_DOMAIN=controlapp.site" >> $GITHUB_ENV
            echo "APP_ENV=production" >> $GITHUB_ENV
            echo "APP_NAME=ControlApp" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DB_DATABASE=control_prod" >> $GITHUB_ENV
            echo "LOG_CHANNEL=stderr" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "DEPLOY_PATH=/home/guaro/docker-sites/controlapp-ptr" >> $GITHUB_ENV
            echo "APP_DOMAIN=ptr.controlapp.site" >> $GITHUB_ENV
            echo "APP_ENV=staging" >> $GITHUB_ENV
            echo "APP_NAME=ControlApp PTR" >> $GITHUB_ENV
            echo "IMAGE_TAG=testing" >> $GITHUB_ENV
            echo "DB_DATABASE=control_ptr" >> $GITHUB_ENV
            echo "LOG_CHANNEL=stderr" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry (Local)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/felondz/controlapp:$IMAGE_TAG

      - name: Prepare Directory
        run: mkdir -p $DEPLOY_PATH

      # --- CORRECCIÓN 1: Descargar el archivo DE LA RAMA CORRECTA ---
      - name: Download Docker Compose
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o $DEPLOY_PATH/docker-compose.yml \
            -L "https://api.github.com/repos/Felondz/controlApp/contents/docker-compose.prod.yml?ref=${{ github.ref_name }}"

      # --- CORRECCIÓN 2: Agregar TODAS las variables al .env ---
      - name: Create .env file
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          APP_KEY: ${{ secrets.APP_KEY }}
          MEILISEARCH_KEY: ${{ secrets.MEILISEARCH_KEY }}
        run: |
          cd $DEPLOY_PATH
          # Usamos comillas simples para evitar que bash interprete nada durante la creación
          echo 'APP_ENV=${{ env.APP_ENV }}' > .env
          echo 'APP_DOMAIN=${{ env.APP_DOMAIN }}' >> .env
          echo 'APP_URL=https://${{ env.APP_DOMAIN }}' >> .env
          echo 'ASSET_URL=/' >> .env
          echo 'IMAGE_TAG=${{ env.IMAGE_TAG }}' >> .env
          echo 'DB_DATABASE=${{ env.DB_DATABASE }}' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=db' >> .env
          
          # Variables Secretas
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'MEILISEARCH_KEY=${{ secrets.MEILISEARCH_KEY }}' >> .env
          echo 'QUEUE_CONNECTION=redis' >> .env
          echo 'SCOUT_DRIVER=meilisearch' >> .env
          echo 'MEILISEARCH_HOST=http://meilisearch:7700' >> .env
          echo 'REDIS_HOST=redis' >> .env
          echo 'REDIS_PORT=6379' >> .env
          echo 'SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}' >> .env
          echo 'SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}' >> .env
          
          # --- REVERB / WEBSOCKETS ---
          echo 'REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}' >> .env
          echo 'REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}' >> .env
          echo 'REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}' >> .env
          echo 'REVERB_HOST=ws.${{ env.APP_DOMAIN }}' >> .env
          echo 'REVERB_PORT=443' >> .env
          echo 'REVERB_SCHEME=https' >> .env
          echo 'VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}' >> .env
          echo 'VITE_REVERB_HOST=ws.${{ env.APP_DOMAIN }}' >> .env
          echo 'VITE_REVERB_PORT=443' >> .env
          echo 'VITE_REVERB_SCHEME=https' >> .env
          
          # --- EMAIL CONFIGURATION ---
          echo 'MAIL_MAILER=smtp' >> .env
          echo 'MAIL_HOST=smtp-relay.brevo.com' >> .env
          echo 'MAIL_PORT=587' >> .env
          echo 'MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}' >> .env
          echo 'MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}' >> .env
          echo 'MAIL_ENCRYPTION=tls' >> .env
          echo 'MAIL_FROM_ADDRESS=no-reply@controlapp.site' >> .env
          echo 'MAIL_FROM_NAME="${{ env.APP_NAME }} (${{ env.IMAGE_TAG }})"' >> .env

      - name: Deploy and Optimize
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_DATABASE: ${{ env.DB_DATABASE }}
        run: |
          cd $DEPLOY_PATH
          
          docker compose down --remove-orphans || true
          
          echo "🚀 Desplegando en entorno: $APP_ENV"
          docker compose pull
          docker compose up -d --force-recreate || ( echo "❌ Error al levantar contenedores. Mostrando logs: " && docker compose logs meilisearch && docker compose logs db && exit 1 )
          
          echo "⏳ Esperando estabilización (15s)..."
          sleep 15
          
          # Permisos
          docker compose exec -T app mkdir -p storage/framework/views
          docker compose exec -T app chmod -R 777 storage bootstrap/cache
          docker compose exec -T app chown -R www-data:www-data storage bootstrap/cache

          # Infraestructura de BD
          echo "🔧 Asegurando infraestructura de BD..."
          docker compose exec -T -e MYSQL_PWD="$DB_PASSWORD" db mysql -u root -e "CREATE DATABASE IF NOT EXISTS $DB_DATABASE; CREATE USER IF NOT EXISTS '$DB_USERNAME'@'%' IDENTIFIED BY '$DB_PASSWORD'; GRANT ALL PRIVILEGES ON $DB_DATABASE.* TO '$DB_USERNAME'@'%'; FLUSH PRIVILEGES;"
          
          docker compose exec -T app php artisan migrate --force
          
          # Seeders
          echo "🌱 Ejecutando Seeders Esenciales (ModuleSeeder)..."
          docker compose exec -T app php artisan db:seed --class=ModuleSeeder --force
          
          # Optimización
          docker compose exec -T app php artisan storage:link
          docker compose exec -T app php artisan optimize:clear
          docker compose exec -T app php artisan optimize
          docker compose exec -T app php artisan view:cache
          docker compose exec -T app php artisan queue:restart
          
      - name: Cleanup
        run: docker image prune -f
