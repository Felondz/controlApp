name: CI/CD Pipeline (Multi-Environment)

on:
  push:
    branches: [ "main", "develop" ] # Agregamos la rama de testing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: felondz/controlapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generamos metadatos dinámicos según la rama
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Si es main, usa 'latest'. Si es develop, usa 'testing'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab]
    steps:
      # 1. Definir variables de entorno según la rama
      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DEPLOY_PATH=/home/guaro/docker-sites/controlapp" >> $GITHUB_ENV
            echo "APP_DOMAIN=controlapp.site" >> $GITHUB_ENV # Tu dominio real
            echo "APP_ENV=production" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DB_DATABASE=control_prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "DEPLOY_PATH=/home/guaro/docker-sites/controlapp-ptr" >> $GITHUB_ENV
            echo "APP_DOMAIN=ptr.controlapp.site" >> $GITHUB_ENV
            echo "APP_ENV=local" >> $GITHUB_ENV # O 'staging'
            echo "IMAGE_TAG=testing" >> $GITHUB_ENV
            echo "DB_DATABASE=control_ptr" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry (Local)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/felondz/controlapp:$IMAGE_TAG

      # 2. Crear directorio si no existe (importante para la primera vez del PTR)
      - name: Prepare Directory
        run: |
          mkdir -p $DEPLOY_PATH
          
      - name: Download Docker Compose
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o $DEPLOY_PATH/docker-compose.yml \
            -L https://api.github.com/repos/Felondz/controlApp/contents/docker-compose.prod.yml

      # 3. Crear archivo .env dinámicamente (Opcional pero recomendado)
      # Aquí inyectamos las variables para que docker compose las lea
      - name: Create .env file
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          cd $DEPLOY_PATH
          # Crea un .env básico con las variables necesarias para el compose
          echo "APP_ENV=$APP_ENV" > .env
          echo "APP_DOMAIN=$APP_DOMAIN" >> .env
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          # Agrega aquí tus secretos de Github (DB_PASSWORD, etc)
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env
          echo "APP_KEY=$APP_KEY" >> .env

      - name: Deploy and Optimize
        run: |
          cd $DEPLOY_PATH
          
          echo "🚀 Desplegando en entorno: $APP_ENV - URL: $APP_DOMAIN"
          
          # Levantar contenedores pasando las variables de entorno
          docker compose up -d --force-recreate --remove-orphans
          
          echo "⏳ Esperando estabilización (15s)..."
          sleep 15
          
          # Comandos de Laravel (usando el nombre dinámico del servicio si es necesario, 
          # pero 'app' dentro del contexto de esa carpeta funciona bien)
          
          echo "🗄️ Ejecutando migraciones..."
          docker compose exec -T app php artisan migrate --force

          # OJO: Solo correr seeders en PTR/Testing para no dañar datos reales
          if [[ "$APP_ENV" != "production" ]]; then
             echo "🌱 Seeders de prueba..."
             docker compose exec -T app php artisan db:seed --force
          fi
          
          echo "🧹 Optimizando..."
          docker compose exec -T app php artisan optimize:clear
          docker compose exec -T app php artisan optimize
          docker compose exec -T app php artisan view:cache
          docker compose exec -T app php artisan storage:link
          docker compose exec -T app php artisan queue:restart

          # Meilisearch (Opcional: podrías querer índices separados para testing)
          # docker compose exec -T app php artisan scout:import "App\Models\User"
          
      - name: Cleanup
        run: docker image prune -f