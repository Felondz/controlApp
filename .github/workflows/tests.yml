name: Tests

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: true

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, json, bcmath, dom, xml, gd
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build assets with Vite
        run: npm run build

      - name: Create .env file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup testing environment
        run: |
          # Override DB_HOST for CI (GitHub Actions uses 127.0.0.1, not mysql)
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          # Force MAIL_MAILER to log for CI (no mailpit available)
          # Remove any existing MAIL_* configuration lines and ensure log driver
          sed -i '/^MAIL_/d' .env.testing
          echo "MAIL_MAILER=log" >> .env.testing
          echo "MAIL_FROM_ADDRESS=test@example.com" >> .env.testing
          echo "MAIL_FROM_NAME=ControlApp_Tests" >> .env.testing
          # Add CI-specific settings (only if not already present)
          grep -q "^QUEUE_CONNECTION" .env.testing || echo "QUEUE_CONNECTION=sync" >> .env.testing
          grep -q "^BROADCAST_DRIVER" .env.testing || echo "BROADCAST_DRIVER=log" >> .env.testing
          grep -q "^CI=" .env.testing || echo "CI=true" >> .env.testing
          # Ensure APP_KEY is set (should already be in .env.testing)
          grep -q "^APP_KEY" .env.testing || (php artisan key:generate --env=testing && grep "APP_KEY" .env | sed 's/^/# From .env: /' >> .env.testing)

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" -u"root" -p"password" --silent; do
            echo 'waiting for mysql...'
            sleep 1
          done

      - name: Run migrations
        run: php artisan migrate --env=testing
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: password
          MAIL_MAILER: log
          QUEUE_CONNECTION: sync
          BROADCAST_DRIVER: log

      - name: Run tests
        run: php artisan test --testdox
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: password
          MAIL_MAILER: log
          QUEUE_CONNECTION: sync
          BROADCAST_DRIVER: log

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            storage/logs/
            tests/

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test -- --reporter=verbose --run

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-test-results
          path: |
            coverage/

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Larastan (PHPStan with Laravel support)
        run: vendor/bin/phpstan analyse --memory-limit=512M
        continue-on-error: true

      - name: Run PHPStan (backup)
        run: phpstan analyse app --level=8 --memory-limit=512M || true
        continue-on-error: true
