services:
  # --- APLICACIÓN PRINCIPAL ---
  app:
    image: ghcr.io/felondz/controlapp:latest
    container_name: controlapp_app_${APP_ENV}
    restart: unless-stopped
    env_file: ./.env
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

    volumes:
      # Persistencia de logs y almacenamiento subido por usuarios
      - ./storage:/var/www/html/storage
    
    networks:
      - proxy    # Pública (Traefik)
      - internal # Privada (DB/Redis)

    labels:
      - "traefik.enable=true"
      # --- SOLUCIÓN ERROR 504 (OBLIGAR USO DE RED PROXY) ---
      - "traefik.docker.network=proxy"
      # -----------------------------------------------------

      # Router Principal (HTTPS)
      - "traefik.http.routers.controlapp-root-https-${APP_ENV}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.controlapp-root-https-${APP_ENV}.entrypoints=websecure"
      - "traefik.http.routers.controlapp-root-https-${APP_ENV}.tls.certresolver=letsencrypt"
      
      # Redirección HTTP -> HTTPS
      - "traefik.http.routers.controlapp-root-http-${APP_ENV}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.controlapp-root-http-${APP_ENV}.entrypoints=web"
      - "traefik.http.routers.controlapp-root-http-${APP_ENV}.middlewares=cattleya-https-redirect"
      - "traefik.http.middlewares.cattleya-https-redirect.redirectscheme.scheme=https"

      # Router API
      - "traefik.http.routers.controlapp-api-https-${APP_ENV}.rule=Host(`api.${APP_DOMAIN}`)"
      - "traefik.http.routers.controlapp-api-https-${APP_ENV}.entrypoints=websecure"
      - "traefik.http.routers.controlapp-api-https-${APP_ENV}.tls.certresolver=letsencrypt"

      # Servicio (Puerto 80 es correcto para Apache)
      - "traefik.http.services.controlapp-service.loadbalancer.server.port=80"

  # --- BASE DE DATOS ---
  db:
    image: mysql:8.0
    container_name: controlapp_db_${APP_ENV}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # --- REDIS ---
  redis:
    image: redis:alpine
    container_name: controlapp_redis_${APP_ENV}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- MEILISEARCH ---
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: controlapp_meilisearch_${APP_ENV}
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_ENV=production
    volumes:
      - meili_data:/meili_data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  meili_data:
