services:
  app:
    # Usamos tu usuario de GitHub (Felondz) detectado en los logs anteriores
    image: ghcr.io/felondz/controlapp:latest
    container_name: controlapp_app
    restart: unless-stopped
    environment:
      # Forzamos los drivers de caché y sesión a 'file' para evitar el bloqueo silencioso
      CACHE_DRIVER: file
      SESSION_DRIVER: file
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - proxy # Red pública (Traefik)
      - internal # Red privada (DB)
    labels:
      - "traefik.enable=true"
      # =========================================================
      # A. ROUTER PRINCIPAL (Dominio Raíz - Landing Page / Login)
      # Responde a https://controlapp.site
      # =========================================================

      # 1. HTTP (Redirección 80 -> 443)
      - "traefik.http.routers.controlapp-root-http.rule=Host(`controlapp.site`)"
      - "traefik.http.routers.controlapp-root-http.entrypoints=web"
      - "traefik.http.routers.controlapp-root-http.middlewares=cattleya-https-redirect"

      # 2. HTTPS (Seguro 443)
      - "traefik.http.routers.controlapp-root-https.rule=Host(`controlapp.site`)"
      - "traefik.http.routers.controlapp-root-https.entrypoints=websecure"
      - "traefik.http.routers.controlapp-root-https.tls.certresolver=letsencrypt"

      # =========================================================
      # B. ROUTER SECUNDARIO (Subdominio API - APIREST)
      # Responde a https://api.controlapp.site
      # =========================================================

      # 1. HTTP (Redirección 80 -> 443)
      - "traefik.http.routers.controlapp-api-http.rule=Host(`api.controlapp.site`)"
      - "traefik.http.routers.controlapp-api-http.entrypoints=web"
      - "traefik.http.routers.controlapp-api-http.middlewares=cattleya-https-redirect"

      # 2. HTTPS (Seguro 443)
      - "traefik.http.routers.controlapp-api-https.rule=Host(`api.controlapp.site`)"
      - "traefik.http.routers.controlapp-api-https.entrypoints=websecure"
      - "traefik.http.routers.controlapp-api-https.tls.certresolver=letsencrypt"

      # =========================================================
      # C. SERVICIO (Ambos Routers usan el mismo Backend)
      # Apunta al puerto interno 80 del contenedor
      # =========================================================
      - "traefik.http.services.controlapp-service.loadbalancer.server.port=80"

  db:
    image: mysql:8.0
    container_name: controlapp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

networks:
  proxy:
    external: true # Se conecta a la red existente de Traefik en tu servidor
  internal:
    driver: bridge

volumes:
  db_data:
