services:
  # --- APLICACIÓN PRINCIPAL ---
  app:
    image: ghcr.io/felondz/controlapp:latest
    container_name: controlapp_app
    restart: unless-stopped
    env_file: ./.env
    
    depends_on:
      - db
      - redis
      - meilisearch

    volumes:
      # Persistencia de logs y almacenamiento subido por usuarios
      - ./storage:/var/www/html/storage
    
    networks:
      - proxy    # Pública (Traefik)
      - internal # Privada (DB/Redis)

    labels:
      - "traefik.enable=true"
      # --- SOLUCIÓN ERROR 504 (OBLIGAR USO DE RED PROXY) ---
      - "traefik.docker.network=proxy"
      # -----------------------------------------------------

      # Router Principal (HTTPS)
      - "traefik.http.routers.controlapp-root-https.rule=Host(`controlapp.site`)"
      - "traefik.http.routers.controlapp-root-https.entrypoints=websecure"
      - "traefik.http.routers.controlapp-root-https.tls.certresolver=letsencrypt"
      
      # Redirección HTTP -> HTTPS
      - "traefik.http.routers.controlapp-root-http.rule=Host(`controlapp.site`)"
      - "traefik.http.routers.controlapp-root-http.entrypoints=web"
      - "traefik.http.routers.controlapp-root-http.middlewares=cattleya-https-redirect"
      - "traefik.http.middlewares.cattleya-https-redirect.redirectscheme.scheme=https"

      # Router API
      - "traefik.http.routers.controlapp-api-https.rule=Host(`api.controlapp.site`)"
      - "traefik.http.routers.controlapp-api-https.entrypoints=websecure"
      - "traefik.http.routers.controlapp-api-https.tls.certresolver=letsencrypt"

      # Servicio (Puerto 80 es correcto para Apache)
      - "traefik.http.services.controlapp-service.loadbalancer.server.port=80"

  # --- BASE DE DATOS ---
  db:
    image: mysql:8.0
    container_name: controlapp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  # --- REDIS ---
  redis:
    image: redis:alpine
    container_name: controlapp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  # --- MEILISEARCH ---
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: controlapp_meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_ENV=production
    volumes:
      - meili_data:/meili_data
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  meili_data:
