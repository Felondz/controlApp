services:
  app:
    # Usamos tu usuario de GitHub (Felondz) detectado en los logs anteriores
    image: ghcr.io/felondz/controlapp:latest
    container_name: controlapp_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - proxy # Red pública (Traefik)
      - internal # Red privada (DB)
    labels:
      - "traefik.enable=true"
      # Configuración HTTP (Puerto 80)
      - "traefik.http.routers.controlapp-http.rule=Host(`tu-futuro-dominio.com`)"
      - "traefik.http.routers.controlapp-http.entrypoints=web"
      # Configuración HTTPS (Puerto 443)
      - "traefik.http.routers.controlapp-https.rule=Host(`tu-futuro-dominio.com`)"
      - "traefik.http.routers.controlapp-https.entrypoints=websecure"
      - "traefik.http.routers.controlapp-https.tls.certresolver=letsencrypt"
      # Puerto interno del contenedor
      - "traefik.http.services.controlapp.loadbalancer.server.port=80"

  db:
    image: mysql:8.0
    container_name: controlapp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

networks:
  proxy:
    external: true # Se conecta a la red existente de Traefik en tu servidor
  internal:
    driver: bridge

volumes:
  db_data:
