"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

# Módulos
#import Inventory/*.graphql
#import Operations/*.graphql
#import Finance/*.graphql

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Get the currently authenticated user."
    me: User @auth

    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
    
    "User's settings and preferences"
    settings: UserSettings
    
    "User's configured LLM settings"
    llmSettings: [UserLlmSetting!]! @hasMany
}

"User's global settings and preferences"
type UserSettings {
    completed_tours: [String!]
}

"User's LLM API Configuration"
type UserLlmSetting {
    id: ID!
    provider: String!
    default_model: String
    is_active: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type Mutation {
    "Create or update an LLM configuration for the user."
    upsertUserLlmSetting(
        provider: String!
        api_key: String
        default_model: String
        is_active: Boolean
    ): UserLlmSetting! @field(resolver: "App\\GraphQL\\Mutations\\UpsertUserLlmSetting")
    
    "Delete an LLM configuration for the user."
    deleteUserLlmSetting(
        provider: String!
    ): Boolean! @field(resolver: "App\\GraphQL\\Mutations\\DeleteUserLlmSetting")

    "Mark an interactive tour as completed for the current user."
    completeTour(
        tour: String!
    ): User! @field(resolver: "App\\GraphQL\\Mutations\\CompleteTour") @auth
}
