type Task {
    id: ID!
    uuid: String!
    project_id: ID!
    task_number: Int
    task_id_string: String
    title: String!
    description: String
    status: String!
    priority: String!
    due_date: DateTime
    assigned_to: ID
    image_url: String
    images: [TaskImage!]! @hasMany
    comments: [TaskComment!]! @hasMany
    assignee: User @belongsTo
    created_at: DateTime!
    updated_at: DateTime!
}

type TaskImage {
    id: ID!
    uuid: String!
    image_url: String!
    created_at: DateTime!
}

type TaskComment {
    id: ID!
    uuid: String!
    content: String!
    user: User! @belongsTo
    created_at: DateTime!
}

extend type Query {
    "Listar tareas de un proyecto"
    tasks(
        project_id: ID! @eq
        status: String @eq
    ): [Task!]! @all @guard
    
    "Obtener una tarea específica"
    task(id: ID! @eq): Task @find @guard
}

extend type Mutation {
    "Crear una nueva tarea"
    createTask(
        project_id: ID!
        title: String!
        description: String
        status: String
        priority: String
        due_date: String
        assigned_to: ID
        assignees: [ID!]
        related_type: String
        related_id: String
    ): Task! @field(resolver: "App\\Modules\\Tasks\\GraphQL\\Mutations\\TaskMutations@createTask") @guard

    "Actualizar una tarea"
    updateTask(
        id: ID!
        title: String
        description: String
        status: String
        priority: String
        due_date: String
        assigned_to: ID
        assignees: [ID!]
        related_type: String
        related_id: String
    ): Task! @field(resolver: "App\\Modules\\Tasks\\GraphQL\\Mutations\\TaskMutations@updateTask") @guard

    "Eliminar una tarea"
    deleteTask(id: ID!): Boolean! @delete(model: "Task") @guard

    "Añadir un comentario a una tarea"
    createTaskComment(
        task_id: ID!
        content: String!
        mentioned_user_ids: [ID!]
    ): TaskComment! @field(resolver: "App\\Modules\\Tasks\\GraphQL\\Mutations\\TaskMutations@createTaskComment") @guard
}
